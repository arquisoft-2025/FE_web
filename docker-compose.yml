version: '3.8'

services:
  # Servicio de desarrollo - React Frontend
  app:
    image: localhost/react-app-dev    
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Usar nombres de servicios para comunicación entre contenedores
      - VITE_API_BASE_URL=http://localhost:5000
      - VITE_API_TOKEN=http://localhost:5002
      - VITE_API_BASE_URL_IMAGE=http://localhost:5001
      - VITE_API_SHOPPING_CART=http://localhost:5003
    stdin_open: true
    tty: true
    container_name: mi-react-app-dev
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - donation-api
      - shopping-cart-api
      - user_management_api
      - mongo
    networks:
      - react-app-network

  # Servicio API de Donaciones
  donation-api:
    image: localhost/donation-api-v5
    container_name: donation-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - MONGO_URI=mongodb://mongo:27017/donationsdb
    depends_on:
      - mongo
    volumes:
      - ./uploads:/app/uploads
    networks:
      - react-app-network

  notification-api:
    image: localhost/notification-api
    container_name: notification-api
    ports:
      - "5001:5001"
    environment:
      - API_BASE_URL=http://donation-api:5000
      # Descomenta y configura estas variables si necesitas funcionalidad de email
      - MAIL_USERNAME=noahsarmi@gmail.com
      - MAIL_PASSWORD=bcrl hjqx pmfc nbke
    # Si tienes un archivo .env, puedes usarlo así:
    # env_file:
    #   - .env
    networks:
      - react-app-network


  shopping-cart-api:
    image: localhost/shopping-cart-api
    container_name: shopping-cart-api
    ports:
      - "5003:5003"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - MONGO_URI=mongodb://mongo:27017/shoppingcartdb
      - DONATION_API_URL=http://donation-api:5000
      - NOTIFICATION_API_URL=http://notification-api:5001
    depends_on:
      - mongo
    networks:
      - react-app-network  

  # API de gestión de usuarios
  user_management_api:
    image: localhost/user-management-api
    container_name: user_management_api
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=user_management
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - FLASK_ENV=production
    depends_on:
      - mysql
    networks:
      - react-app-network

  mongo:
    image: mongo:latest
    container_name: donation-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - react-app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

    # MySQL
  mysql:
    image: mysql:8.0
    container_name: user_management_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_management
      MYSQL_USER: user_app
      MYSQL_PASSWORD: userpass123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - react-app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10   

networks:
  react-app-network:
    driver: bridge

volumes:
  mongo_data:
  mysql_data: