services:
  # Frontend web (production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # Browser must access localhost:8443 through reverse proxy
        VITE_API_BASE_URL: "https://localhost:8443/api/v1/donations"
        VITE_API_TOKEN: "https://localhost:8443/api/v1/users"
    ports:
      - "80:80"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      # These are not used by the built bundle; build-time args above are used.
      # Kept here for dev reference only.
      - VITE_API_BASE_URL=https://localhost:8443/api/v1/donations
      - VITE_API_TOKEN=https://localhost:8443/api/v1/users
    depends_on:
      web-reverse-proxy:
        condition: service_healthy
    networks:
      - frontend-network

  # Development service (optional)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - VITE_API_BASE_URL=https://localhost:8443/api/v1/donations
      - VITE_API_TOKEN=https://localhost:8443/api/v1/users
    depends_on:
      - web-reverse-proxy
    networks:
      - frontend-network
    profiles:
      - dev

  # ========================================
  # Web Reverse Proxy with Load Balancer
  # ========================================
  
  web-reverse-proxy:
    build:
      context: ../FE_Web_Proxy
      dockerfile: Dockerfile
    container_name: web-reverse-proxy
    ports:
      - "8443:443"
      - "8444:80"
    environment:
      - TZ=America/Bogota
    volumes:
      - ../FE_Web_Proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - web-reverse-proxy-logs:/var/log/nginx
    depends_on:
      web-api-gateway-1:
        condition: service_healthy
      web-api-gateway-2:
        condition: service_healthy
      web-api-gateway-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost/proxy/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - frontend-network
    labels:
      - "description=Reverse Proxy with Load Balancer for FE_Web"
      - "service=reverse-proxy"
      - "load-balancer=enabled"
      - "load-balancer.algorithm=round_robin"
      - "load-balancer.instances=3"

  # ========================================
  # API Gateway Instances for FE_Web (Load Balanced)
  # ========================================
  
  # Web API Gateway Instance 1 (Primary - Weight 3)
  web-api-gateway-1:
    build:
      context: ../Api_Gateway
      dockerfile: Dockerfile
    container_name: web-api-gateway-1
    ports:
      - "8080:8080"
    volumes:
      - web-api-gateway-1-certs:/app/certs
    environment:
      - PORT=8080
      - ENABLE_HTTPS=true
      - SERVICE_USER_URL=http://user_management_api:5002
      - SERVICE_DONATION_URL=http://donation-api:5000
      - SERVICE_CART_URL=http://shopping-cart-api:5003
      - SERVICE_NOTIFICATION_URL=http://notification-api:5001
      - INSTANCE_ID=web-1
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      donation-api:
        condition: service_healthy
      user_management_api:
        condition: service_started
      shopping-cart-api:
        condition: service_started
      notification-api:
        condition: service_started
    networks:
      - frontend-network
      - backend-network
    restart: unless-stopped
    labels:
      - "load-balancer.weight=3"
      - "load-balancer.instance=primary"
      - "service=web-gateway"

  # Web API Gateway Instance 2 (Secondary - Weight 2)
  web-api-gateway-2:
    build:
      context: ../Api_Gateway
      dockerfile: Dockerfile
    container_name: web-api-gateway-2
    ports:
      - "8084:8080"
    volumes:
      - web-api-gateway-2-certs:/app/certs
    environment:
      - PORT=8080
      - ENABLE_HTTPS=true
      - SERVICE_USER_URL=http://user_management_api:5002
      - SERVICE_DONATION_URL=http://donation-api:5000
      - SERVICE_CART_URL=http://shopping-cart-api:5003
      - SERVICE_NOTIFICATION_URL=http://notification-api:5001
      - INSTANCE_ID=web-2
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      donation-api:
        condition: service_healthy
      user_management_api:
        condition: service_started
      shopping-cart-api:
        condition: service_started
      notification-api:
        condition: service_started
    networks:
      - frontend-network
      - backend-network
    restart: unless-stopped
    labels:
      - "load-balancer.weight=2"
      - "load-balancer.instance=secondary"
      - "service=web-gateway"

  # Web API Gateway Instance 3 (Tertiary - Weight 1)
  web-api-gateway-3:
    build:
      context: ../Api_Gateway
      dockerfile: Dockerfile
    container_name: web-api-gateway-3
    ports:
      - "8085:8080"
    volumes:
      - web-api-gateway-3-certs:/app/certs
    environment:
      - PORT=8080
      - ENABLE_HTTPS=true
      - SERVICE_USER_URL=http://user_management_api:5002
      - SERVICE_DONATION_URL=http://donation-api:5000
      - SERVICE_CART_URL=http://shopping-cart-api:5003
      - SERVICE_NOTIFICATION_URL=http://notification-api:5001
      - INSTANCE_ID=web-3
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      donation-api:
        condition: service_healthy
      user_management_api:
        condition: service_started
      shopping-cart-api:
        condition: service_started
      notification-api:
        condition: service_started
    networks:
      - frontend-network
      - backend-network
    restart: unless-stopped
    labels:
      - "load-balancer.weight=1"
      - "load-balancer.instance=tertiary"
      - "service=web-gateway"

  # ========================================
  # API Gateway Instances for FE_Mobile (Load Balanced with Segmented Networks)
  # ========================================
  
  # Mobile API Gateway Instance 1 (Primary - Weight 3)
  mobile-api-gateway-1:
    build:
      context: ../Api_Gateway
      dockerfile: Dockerfile
    container_name: mobile-api-gateway-1
    ports:
      - "8081:8080"
    volumes:
      - mobile-api-gateway-1-certs:/app/certs
    environment:
      - PORT=8080
      - ENABLE_HTTPS=false
      - SERVICE_USER_URL=http://user_management_api:5002
      - SERVICE_DONATION_URL=http://donation-api:5000
      - SERVICE_CART_URL=http://shopping-cart-api:5003
      - SERVICE_NOTIFICATION_URL=http://notification-api:5001
      - INSTANCE_ID=mobile-1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      donation-api:
        condition: service_healthy
      user_management_api:
        condition: service_started
      shopping-cart-api:
        condition: service_started
      notification-api:
        condition: service_started
    networks:
      - mobile-frontend-network
      - mobile-backend-network
    restart: unless-stopped
    labels:
      - "load-balancer.weight=3"
      - "load-balancer.instance=primary"
      - "service=mobile-gateway"

  # Mobile API Gateway Instance 2 (Secondary - Weight 2)
  mobile-api-gateway-2:
    build:
      context: ../Api_Gateway
      dockerfile: Dockerfile
    container_name: mobile-api-gateway-2
    ports:
      - "8082:8080"
    volumes:
      - mobile-api-gateway-2-certs:/app/certs
    environment:
      - PORT=8080
      - ENABLE_HTTPS=false
      - SERVICE_USER_URL=http://user_management_api:5002
      - SERVICE_DONATION_URL=http://donation-api:5000
      - SERVICE_CART_URL=http://shopping-cart-api:5003
      - SERVICE_NOTIFICATION_URL=http://notification-api:5001
      - INSTANCE_ID=mobile-2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      donation-api:
        condition: service_healthy
      user_management_api:
        condition: service_started
      shopping-cart-api:
        condition: service_started
      notification-api:
        condition: service_started
    networks:
      - mobile-frontend-network
      - mobile-backend-network
    restart: unless-stopped
    labels:
      - "load-balancer.weight=2"
      - "load-balancer.instance=secondary"
      - "service=mobile-gateway"

  # Mobile API Gateway Instance 3 (Tertiary - Weight 1)
  mobile-api-gateway-3:
    build:
      context: ../Api_Gateway
      dockerfile: Dockerfile
    container_name: mobile-api-gateway-3
    ports:
      - "8083:8080"
    volumes:
      - mobile-api-gateway-3-certs:/app/certs
    environment:
      - PORT=8080
      - ENABLE_HTTPS=false
      - SERVICE_USER_URL=http://user_management_api:5002
      - SERVICE_DONATION_URL=http://donation-api:5000
      - SERVICE_CART_URL=http://shopping-cart-api:5003
      - SERVICE_NOTIFICATION_URL=http://notification-api:5001
      - INSTANCE_ID=mobile-3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      donation-api:
        condition: service_healthy
      user_management_api:
        condition: service_started
      shopping-cart-api:
        condition: service_started
      notification-api:
        condition: service_started
    networks:
      - mobile-frontend-network
      - mobile-backend-network
    restart: unless-stopped
    labels:
      - "load-balancer.weight=1"
      - "load-balancer.instance=tertiary"
      - "service=mobile-gateway"

  # Donation API (Flask + Mongo + Redis)
  donation-api:
    build:
      context: ../BE_Donation
      dockerfile: Dockerfile
    container_name: donation-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - JWT_SECRET_KEY=lkhjap8gy2p_03kt
      - MONGO_URI=mongodb://mongo:27017/donationsdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../BE_Donation/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/graphql"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network
      - backend-network
      - web-database-network
      - mobile-backend-network
      - mobile-database-network

  # Notification API (Flask)
  notification-api:
    build:
      context: ../BE_notification
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - API_BASE_URL=http://donation-api:5000
      - JWT_SECRET_KEY=lkhjap8gy2p_03kt
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-internal-key}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAILJET_API_KEY_PUBLIC=${MAILJET_API_KEY_PUBLIC}
      - MAILJET_API_KEY_PRIVATE=${MAILJET_API_KEY_PRIVATE}
      - MAIL_SENDER=${MAIL_SENDER}
    networks:
      - app-network
      - backend-network
      - mobile-backend-network

  # Notification broker API (enqueue service)
  notification-broker-api:
    build:
      context: ../Notification-asynchrony
      dockerfile: Dockerfile
    container_name: notification-broker-api
    command: ["python", "enqueue_api.py"]
    environment:
      - RABBIT_HOST=rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_USER=guest
      - RABBIT_PASS=guest
      - NOTIFICATION_QUEUE=notification_queue
      - ENQUEUE_PORT=5002
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - app-network
      - backend-network
      - web-messaging-network
      - mobile-backend-network
      - mobile-messaging-network

  # Shopping Cart API (Flask + Mongo)
  shopping-cart-api:
    build:
      context: ../BE_Shopping_cart
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    environment:
      - MONGO_URI=mongodb://mongo:27017/shopping_cart_db
      - JWT_SECRET_KEY=lkhjap8gy2p_03kt
      - DONATION_API_URL=http://donation-api:5000
      - NOTIFICATION_API_URL=http://notification-api:5001
      - NOTIFICATION_BROKER_URL=http://notification-broker-api:5002
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network
      - backend-network
      - web-database-network
      - mobile-backend-network
      - mobile-database-network

  # User Management API (Flask + MySQL)
  user_management_api:
    build:
      context: ../BE_User_Management
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=user_management
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - JWT_SECRET_KEY=lkhjap8gy2p_03kt
      - FLASK_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
      - backend-network
      - web-database-network
      - mobile-backend-network
      - mobile-database-network

  # Celery worker for async notifications
  notification-worker:
    build:
      context: ../Notification-asynchrony
      dockerfile: Dockerfile
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - NOTIFICATION_API_URL=http://notification-api:5001
      - API_BASE_URL=http://donation-api:5000
      # Optionally set mail creds via env or .env file
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAILJET_API_KEY_PUBLIC=${MAILJET_API_KEY_PUBLIC}
      - MAILJET_API_KEY_PRIVATE=${MAILJET_API_KEY_PRIVATE}
      - MAIL_SENDER=${MAIL_SENDER}
    depends_on:
      redis:
        condition: service_started
      notification-api:
        condition: service_started
    networks:
      - app-network
      - backend-network
      - web-messaging-network
      - web-database-network
      - mobile-backend-network
      - mobile-messaging-network

  # Redis consumer that pops notifications from the queue and forwards to the Notification API
  notification-consumer:
    build:
      context: ../BE_notification
      dockerfile: Dockerfile
    container_name: notification-consumer
    command: ["python", "redis_consumer.py"]
    environment:
      - RABBIT_HOST=rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_USER=guest
      - RABBIT_PASS=guest
      - NOTIFICATION_QUEUE=notification_queue
      - LOCAL_NOTIFICATION_URL=http://notification-api:5001/internal/sendNotification
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-internal-key}
      - API_BASE_URL=http://donation-api:5000
      - JWT_SECRET_KEY=lkhjap8gy2p_03kt
      # - MAIL_USERNAME=${MAIL_USERNAME}
      # - MAIL_PASSWORD=${MAIL_PASSWORD}
      # - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      # - MAIL_PORT=${MAIL_PORT:-587}
      - MAILJET_API_KEY_PUBLIC=${MAILJET_API_KEY_PUBLIC}
      - MAILJET_API_KEY_PRIVATE=${MAILJET_API_KEY_PRIVATE}
      - MAIL_SENDER=${MAIL_SENDER}
    depends_on:
      redis:
        condition: service_started
      notification-api:
        condition: service_started
    networks:
      - app-network
      - backend-network
      - web-messaging-network
      - web-database-network
      - mobile-backend-network
      - mobile-messaging-network

  # Reverse Proxy for FE Mobile (uses same backend as FE Web)
  reverse-proxy:
    build:
      context: ../Reverse_Proxy
      dockerfile: Dockerfile
    container_name: mobile-reverse-proxy
    ports:
      - "9090:80"
    environment:
      - TZ=America/Bogota
    volumes:
      - ../Reverse_Proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - reverse-proxy-logs:/var/log/nginx
    depends_on:
      mobile-api-gateway-1:
        condition: service_healthy
      mobile-api-gateway-2:
        condition: service_healthy
      mobile-api-gateway-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/proxy/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mobile-frontend-network
    labels:
      - "description=Reverse Proxy with Load Balancer for FE_Mobile"
      - "service=reverse-proxy"
      - "load-balancer=enabled"
      - "load-balancer.algorithm=round_robin"
      - "load-balancer.instances=3"

  # Databases and cache
  mongo:
    image: mongo:latest
    container_name: donation-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=donationsdb
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
      - web-database-network
      - mobile-database-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:8.0
    container_name: user_management_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=user_management
      - MYSQL_USER=user_app
      - MYSQL_PASSWORD=userpass123
    volumes:
      - mysql_data:/var/lib/mysql
      - ../BE_User_Management/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql:ro
    networks:
      - app-network
      - web-database-network
      - mobile-database-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: donation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network
      - web-database-network
      - mobile-database-network
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: donation-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - app-network
      - web-messaging-network
      - mobile-messaging-network

volumes:
  mongo_data:
    driver: local
  mysql_data:
    driver: local
  api-gateway-certs:
    driver: local
  mobile-api-gateway-1-certs:
    driver: local
  mobile-api-gateway-2-certs:
    driver: local
  mobile-api-gateway-3-certs:
    driver: local
  web-api-gateway-1-certs:
    driver: local
  web-api-gateway-2-certs:
    driver: local
  web-api-gateway-3-certs:
    driver: local
  reverse-proxy-logs:
    driver: local
  web-reverse-proxy-logs:
    driver: local

networks:
  app-network:
    driver: bridge
  # Web-specific networks for segmentation (4 networks)
  frontend-network:
    driver: bridge
    name: web-frontend-network
  backend-network:
    driver: bridge
    name: web-backend-network
    internal: true  # No external access
  web-database-network:
    driver: bridge
    name: web-database-network
    internal: true  # No external access
  web-messaging-network:
    driver: bridge
    name: web-messaging-network
    internal: true  # No external access
  # Mobile-specific networks for segmentation (4 networks)
  mobile-frontend-network:
    driver: bridge
    name: mobile-frontend-network
  mobile-backend-network:
    driver: bridge
    name: mobile-backend-network
    internal: true  # No external access
  mobile-database-network:
    driver: bridge
    name: mobile-database-network
    internal: true  # No external access
  mobile-messaging-network:
    driver: bridge
    name: mobile-messaging-network
    internal: true  # No external access